    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f7ede2;
            transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .step.visual-bridge-section {
            min-height: 35vh;
        }

        .slide-image {
            max-width: 1000px;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255,255,255,0.4);
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .slide-image.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .visual-bridge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            gap: 1rem;
        }

        .visual-bridge.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .visual-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            animation: float 4s ease-in-out infinite;
        }

        .visual-line {
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.15), transparent);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-12px) translateX(-50%); }
            60% { transform: translateY(-6px) translateX(-50%); }
        }

        @media (max-width: 768px) {
            .step {
                min-height: auto;
                padding: 3rem 1.5rem;
            }
            .step.first-step {
                min-height: 100vh;
            }
            .step.visual-bridge-section {
                min-height: auto;
                padding: 0;
            }
            .visual-icon {
                font-size: 2rem;
            }
            .visual-line {
                height: 35px;
            }
            .slide-image {
                transform: translateY(20px) scale(0.98);
            }
        }

    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('.step');
            const bgContainer = document.getElementById('bg-container');

            const observerOptions = {
                root: null,
                rootMargin: '0px 0px -15% 0px',
                threshold: 0.35
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const img = entry.target.querySelector('.slide-image');
                    const visualBridge = entry.target.querySelector('.visual-bridge');

                    if (entry.isIntersecting) {
                        if (img) img.classList.add('is-visible');
                        if (visualBridge) visualBridge.classList.add('is-visible');

                        const bgColor = entry.target.getAttribute('data-bg');
                        if (bgColor) {
                            bgContainer.style.backgroundColor = bgColor;
                        }
                    } else {
                        if (img) img.classList.remove('is-visible');
                        if (visualBridge) visualBridge.classList.remove('is-visible');
                    }
                });
            }, observerOptions);

            steps.forEach(step => {
                observer.observe(step);
            });
        });

    </script>
